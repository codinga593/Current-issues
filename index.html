<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3fa"><title>Cash / Crisis — Your call.</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="logo">↗</span>cash<span>/</span>crisis</a><div class="header-right"><div class="cash"><span>Cash rate</span><b id="cash-rate">4.85%</b></div><button class="icon-button" id="info" aria-label="About the game">i</button><button class="icon-button" id="restart" aria-label="Restart game">↻</button></div></header>
<main><div class="game-layout"><section class="play-area" aria-label="Policy decisions"><div class="stage-top"><span class="eyebrow">YOU ARE THE RBA</span><div class="steps" aria-label="Chapter progress"><span id="step-one" class="active">1</span><i></i><span id="step-two">2</span></div></div><div id="scene" aria-live="polite"></div></section>
<aside class="economy" aria-label="Live economy graphs"><div class="economy-heading"><h2>Your economy</h2><span id="graph-status">STARTING POINT</span></div><article class="chart-card"><div class="chart-top"><span>Inflation</span><strong id="inflation-value">4.2<span>%</span></strong></div><svg id="inflation-chart" viewBox="0 0 320 85" role="img" aria-label="Inflation history"></svg><div class="axis"><span>START</span><span class="chart-end">NOW</span></div></article><article class="chart-card"><div class="chart-top"><span>Unemployment</span><strong id="unemployment-value">4.5<span>%</span></strong></div><svg id="unemployment-chart" viewBox="0 0 320 85" role="img" aria-label="Unemployment history"></svg><div class="axis"><span>START</span><span class="chart-end">NOW</span></div></article><article class="chart-card"><div class="chart-top"><span>GDP <small>index</small></span><strong id="gdp-value">100.0</strong></div><svg id="gdp-chart" viewBox="0 0 320 85" role="img" aria-label="GDP history"></svg><div class="axis"><span>START</span><span class="chart-end">NOW</span></div></article><div class="score-strip"><span>Policy score</span><strong id="score-value">—<small>/100</small></strong></div></aside></div></main>
<footer><span>A fictional crisis. Your decisions have consequences.</span><button id="model-info">Behind the numbers ↗</button></footer><dialog id="modal"><button class="close icon-button" aria-label="Close">×</button><div id="modal-content"></div></dialog><script src="model.js"></script><script src="app.js"></script></body></html>
